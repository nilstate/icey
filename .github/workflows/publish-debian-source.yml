name: Publish Debian Source

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      debian_revision:
        description: "Debian revision for the source upload"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  build-source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ready: ${{ steps.meta.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: meta
        env:
          DEBIAN_REVISION: ${{ github.event.inputs.debian_revision || '1' }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/main' ]]
            [[ "$DEBIAN_REVISION" =~ ^[0-9]+$ ]] && (( DEBIAN_REVISION > 1 ))
            [[ "$(git show "refs/tags/$version:VERSION")" == "$version" ]]
            # Revision uploads reuse the tagged original tarball; only debian/
            # is copied from this checkout by package-debian-source.sh.
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            bash ./scripts/release-publish-readiness.sh
          fi

      - name: Install packaging dependencies
        if: steps.meta.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl debhelper devscripts dpkg-dev rsync

      - name: Build Debian source package
        if: steps.meta.outputs.ready == 'true'
        run: bash ./scripts/package-debian-source.sh "${{ steps.meta.outputs.version }}"
        env:
          DEBIAN_DISTRIBUTION: ${{ vars.PPA_UBUNTU_SERIES || 'noble' }}
          DEBIAN_REVISION: ${{ github.event.inputs.debian_revision || '1' }}
          DEBIAN_PPA_TARGET: ${{ vars.PPA_TARGET || 'ppa:0state/icey' }}

      - uses: actions/upload-artifact@v7
        if: steps.meta.outputs.ready == 'true'
        with:
          name: debian-source-${{ steps.meta.outputs.version }}
          path: |
            build/package/debian/*.dsc
            build/package/debian/*.debian.tar.*
            build/package/debian/*.orig.tar.gz
            build/package/debian/*_source.changes
            build/package/debian/*.buildinfo

  publish-ppa:
    runs-on: ubuntu-24.04
    needs: build-source
    if: needs.build-source.outputs.ready == 'true'
    steps:
      - name: Check PPA publish credentials
        id: gate
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_PUBLISH_ENABLED: ${{ vars.PPA_PUBLISH_ENABLED }}
          PPA_UBUNTU_SERIES: ${{ vars.PPA_UBUNTU_SERIES || 'noble' }}
        run: |
          if [[ "${PPA_PUBLISH_ENABLED:-false}" == "true" && -n "${PPA_GPG_PRIVATE_KEY:-}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing Ubuntu series: ${PPA_UBUNTU_SERIES:-noble}"
          else
            echo "PPA_PUBLISH_ENABLED=true and PPA_GPG_PRIVATE_KEY are required for this release." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'

      - name: Install upload dependencies
        if: steps.gate.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts dput gnupg

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.publish == 'true'
        with:
          name: debian-source-${{ needs.build-source.outputs.version }}
          path: .stage/debian-source

      - name: Import PPA signing key
        if: steps.gate.outputs.publish == 'true'
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/ppa-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec:/ { print $5; exit }')"
          if [[ -z "$key_id" ]]; then
            echo "Failed to discover imported PPA signing key" >&2
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "PPA_SIGNING_KEY_ID=$key_id" >> "$GITHUB_ENV"
          if [[ -n "${PPA_GPG_PASSPHRASE:-}" ]]; then
            echo "PPA_GPG_PASSPHRASE=$PPA_GPG_PASSPHRASE" >> "$GITHUB_ENV"
          fi

      - name: Publish to Launchpad PPA
        if: steps.gate.outputs.publish == 'true'
        env:
          PPA_TARGET: ${{ vars.PPA_TARGET }}
        run: |
          changes_file="$(find .stage/debian-source -maxdepth 1 -type f -name '*_source.changes' | head -n1)"
          if [[ -z "$changes_file" ]]; then
            echo "No Debian source changes file found to upload" >&2
            exit 1
          fi
          bash ./scripts/publish-ppa.sh "$changes_file" "${PPA_TARGET:-ppa:0state/icey}"
