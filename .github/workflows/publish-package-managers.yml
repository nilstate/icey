name: Publish Package Managers

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ready: ${{ steps.meta.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: meta
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash ./scripts/release-publish-readiness.sh

      - name: Preserve exact rendered recipes
        if: steps.meta.outputs.ready == 'true'
        run: tar -C "${{ steps.meta.outputs.render_root }}" -czf release-recipes.tar.gz packaging

      - name: Upload verified recipes
        if: steps.meta.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: icey-release-recipes
          path: release-recipes.tar.gz

  publish-homebrew:
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    steps:
      - name: Check Homebrew publish credentials
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "HOMEBREW_TAP_TOKEN is required for this release." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.publish == 'true'
        with:
          name: icey-release-recipes
          path: .stage

      - name: Extract verified recipes
        if: steps.gate.outputs.publish == 'true'
        run: |
          mkdir -p .stage/release-rendered
          tar -xzf .stage/release-recipes.tar.gz -C .stage/release-rendered

      - name: Checkout tap repo
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          repository: nilstate/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .stage/homebrew-tap

      - name: Publish formulae
        if: steps.gate.outputs.publish == 'true'
        env:
          TAP_REPO_DIR: ${{ github.workspace }}/.stage/homebrew-tap
          FORMULA_SRC_DIR: ${{ github.workspace }}/.stage/release-rendered/packaging/homebrew/Formula
        run: bash ./scripts/publish-homebrew.sh

      - name: Commit formula update
        if: steps.gate.outputs.publish == 'true'
        run: |
          git -C .stage/homebrew-tap config user.name "github-actions[bot]"
          git -C .stage/homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .stage/homebrew-tap add Formula/icey.rb Formula/libdatachannel.rb
          if git -C .stage/homebrew-tap diff --cached --quiet; then
            exit 0
          fi
          git -C .stage/homebrew-tap commit -m "chore(icey): publish ${{ needs.prepare.outputs.version }}"
          git -C .stage/homebrew-tap push

  publish-aur:
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    steps:
      - name: Check AUR publish credentials
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUR_SSH_PRIVATE_KEY is required for this release." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.publish == 'true'
        with:
          name: icey-release-recipes
          path: .stage

      - name: Extract verified recipes
        if: steps.gate.outputs.publish == 'true'
        run: |
          mkdir -p .stage/release-rendered
          tar -xzf .stage/release-recipes.tar.gz -C .stage/release-rendered

      - name: Configure SSH
        if: steps.gate.outputs.publish == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Checkout AUR package
        if: steps.gate.outputs.publish == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
        run: git clone ssh://aur@aur.archlinux.org/icey.git .stage/aur-icey

      - name: Publish AUR package
        if: steps.gate.outputs.publish == 'true'
        env:
          AUR_REPO_DIR: ${{ github.workspace }}/.stage/aur-icey
          AUR_SRC_DIR: ${{ github.workspace }}/.stage/release-rendered/packaging/arch
        run: bash ./scripts/publish-aur.sh

      - name: Commit AUR update
        if: steps.gate.outputs.publish == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
        run: |
          git -C .stage/aur-icey config user.name "0state OSS"
          git -C .stage/aur-icey config user.email "oss@0state.com"
          git -C .stage/aur-icey add PKGBUILD .SRCINFO
          if git -C .stage/aur-icey diff --cached --quiet; then
            exit 0
          fi
          git -C .stage/aur-icey commit -m "chore(icey): publish ${{ needs.prepare.outputs.version }}"
          git -C .stage/aur-icey push
