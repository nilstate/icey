name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and release metadata
        run: |
          bash ./scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Extract changelog
        run: |
          awk '/^## \['"${GITHUB_REF_NAME}"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > release_notes.md

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "DOCKERHUB_USERNAME is required to publish the 0state/icey image" >&2
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "DOCKERHUB_TOKEN is required to publish the 0state/icey image" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: image_meta
        uses: docker/metadata-action@v6
        with:
          images: 0state/icey
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build image once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}

      - name: Verify and publish image
        run: |
          docker run --rm "0state/icey:${GITHUB_REF_NAME}" sh -c \
            'test -d /usr/local/include && find /usr/local/lib -name libicy_base.a -type f | grep -q .'
          docker push "0state/icey:${GITHUB_REF_NAME}"
          docker push 0state/icey:latest
          version_digest="$(docker buildx imagetools inspect "0state/icey:${GITHUB_REF_NAME}" | awk '/^Digest:/ {print $2; exit}')"
          latest_digest="$(docker buildx imagetools inspect 0state/icey:latest | awk '/^Digest:/ {print $2; exit}')"
          test -n "$version_digest"
          test "$version_digest" = "$latest_digest"
          echo "Verified 0state/icey:${GITHUB_REF_NAME} at ${version_digest}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: icey ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
